[project]
name = "bp-tracker"
version = "0.1.0"
description = "Personal blood pressure + heart rate log (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "yoyo-migrations>=9.0.0",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
