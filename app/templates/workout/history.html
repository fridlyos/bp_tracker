{% extends "base.html" %}
{% from "workout/_fmt.html" import session_card %}
{% block content %}
<div class="page-head">
  <div><h1>History</h1><p class="page-subtitle">Your last {{ sessions|length }} workouts</p></div>
</div>
{% if sessions %}
<section class="panel">
  <ul class="entry-list session-list">
    {% for s in sessions %}{{ session_card(s) }}{% endfor %}
  </ul>
</section>
{% else %}
<section class="panel"><p class="muted">No workouts yet. <a href="/workout">Start one</a>.</p></section>
{% endif %}
{% endblock %}
