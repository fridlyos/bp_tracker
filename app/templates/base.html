<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BP Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BP">
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";
  </script>
  <script>
    // server stores local wall-clock times; tell it which zone "now"/"today" are in
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (tz) document.cookie = "tz=" + encodeURIComponent(tz) + ";path=/;max-age=31536000;samesite=lax";
    } catch (e) {}
  </script>
  <script>
    if ("serviceWorker" in navigator)
      addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
  </script>
</head>
<body>
  <div class="layout">
    {% set path = request.url.path %}
    <aside class="sidebar">
      <div class="brand">BP Tracker</div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
      <nav>
        {% if user and user.is_admin %}
          <a href="/users-ui"{% if path.startswith("/users") %} class="active"{% endif %}>Users</a>
        {% elif user %}
          <a href="/"{% if path == "/" %} class="active"{% endif %}>Today</a>
          <a href="/history"{% if path.startswith("/history") %} class="active"{% endif %}>History</a>
          <a href="/settings"{% if path.startswith("/settings") %} class="active"{% endif %}>Settings</a>
        {% endif %}
      </nav>
      {% if user %}
      <div class="whoami">
        {{ user.username }}{% if user.is_admin %}<br><span class="muted">admin</span>{% endif %}
        <form method="post" action="/logout" class="inline"><button type="submit" class="link-button">Log out</button></form>
      </div>
      {% endif %}
    </aside>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    // <form data-confirm="..."> asks before submitting (text via dataset, never inline JS)
    document.querySelectorAll("form[data-confirm]").forEach(f =>
      f.addEventListener("submit", e => { if (!confirm(f.dataset.confirm)) e.preventDefault(); }));
  </script>
  <script>
    (function () {
      const root = document.documentElement;
      const btn = document.querySelector("[data-theme-toggle]");
      function render() {
        const dark = root.dataset.theme === "dark";
        btn.textContent = dark ? "☀️" : "🌙";  // shows the mode you switch TO
        btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      }
      render();
      btn.addEventListener("click", () => {
        root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
        localStorage.setItem("theme", root.dataset.theme);
        render();
      });
    })();
  </script>
</body>
</html>
