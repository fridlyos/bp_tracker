{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Log in</h1>
    <p class="page-subtitle">Sign in to log your blood pressure.</p>
  </div>
</div>

<section class="panel">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username <input name="username" autocomplete="username" required
                           autocapitalize="none" autocorrect="off" spellcheck="false"
                           value="{{ username or '' }}"{% if not username %} autofocus{% endif %}></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required
                           {% if username %} autofocus{% endif %}></label>
    <div class="dialog-actions">
      <button type="submit">Log in</button>
    </div>
  </form>
  <p class="muted">No account? <a href="/register">Register</a>.</p>
</section>
{% endblock %}
