{% extends "base.html" %}
{% block content %}
<h1 class="visually-hidden">Home</h1>
<nav class="launcher" aria-label="Modules">
  {% for m in modules %}
  <a class="app-icon" href="{{ m.href }}">
    <span class="app-icon-img" aria-hidden="true"><svg viewBox="0 0 24 24">{{ m.icon|safe }}</svg></span>
    <span class="app-icon-name">{{ m.name }}</span>
  </a>
  {% endfor %}
</nav>
{% endblock %}
