{% extends "base.html" %}
{% block content %}
<h1 class="visually-hidden">Home</h1>
<nav class="launcher" aria-label="Modules">
  {% for m in modules %}
  {# icon only; the name is for screen readers and the hover tooltip #}
  <a class="app-icon" href="{{ m.href }}" aria-label="{{ m.name }}" title="{{ m.name }}">
    <span class="app-icon-img" aria-hidden="true"><svg viewBox="0 0 24 24">{{ m.icon|safe }}</svg></span>
  </a>
  {% endfor %}
</nav>
{% endblock %}
