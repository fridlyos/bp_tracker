app = "bp-tracker-fridl"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  BP_DB = "/data/bp.db"
  COOKIE_SECURE = "true"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
